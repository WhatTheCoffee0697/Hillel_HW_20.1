  <div class="cursor-dot"></div>

  <div class="cursor-dot"></div>
  <div class="cursor-dot"></div>
</div>

<script>
  const dots = document.querySelectorAll('.cursor-dot');

  let mouseX = 0;
  let mouseY = 0;

  document.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  let positions = Array.from(dots).map(() => ({ x: mouseX, y: mouseY }));

  function animate() {
    positions[0].x += (mouseX - positions[0].x) * 0.3;
    positions[0].y += (mouseY - positions[0].y) * 0.3;

    for (let i = 1; i < positions.length; i++) {
      positions[i].x += (positions[i - 1].x - positions[i].x) * 0.3;
      positions[i].y += (positions[i - 1].y - positions[i].y) * 0.3;
    }

    dots.forEach((dot, i) => {
      dot.style.left = positions[i].x + 'px';
      dot.style.top = positions[i].y + 'px';
      dot.style.transform = `translate(-50%, -50%) scale(${1 - i * 0.08})`;
      dot.style.opacity = `${1 - i * 0.1}`;
    });

    requestAnimationFrame(animate);
  }

  animate();
</script>
